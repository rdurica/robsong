name: robsong
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
section: sound
priority: optional
maintainer: rdurica
description: |
  Lightweight desktop music player for local files.
  Supports MP3, FLAC, WAV, and OGG Vorbis.
vendor: Robsong
homepage: https://github.com/rdurica/robsong
contents:
  - src: dist/robsong
    dst: /usr/bin/robsong
    file_info:
      mode: 0755
  - src: packaging/robsong.desktop
    dst: /usr/share/applications/robsong.desktop
  - src: assets/logo.png
    dst: /usr/share/icons/hicolor/512x512/apps/robsong.png
depends:
  - libGL
  - libX11
  - libXrandr
  - libXcursor
  - libXi
  - libXinerama
  - libXxf86vm
  - libwayland-client
  - libxkbcommon
  - alsa-lib
rpm:
  group: Applications/Multimedia
  compression: xz
